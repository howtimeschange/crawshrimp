            - value: gemini-3.1-pro-preview
              label: Gemini 3.1 Pro Preview
            - value: gemini-3.5-flash
              label: Gemini 3.5 Flash
        fallback_models:
          - id: fallback_model_1
            label: 备选模型 1
            default: gpt-5.6-terra
            options: &shoe_fallback_model_options
              - value: ""
                label: 不使用
              - value: gpt-6-astra
                label: GPT-6 Astra
              - value: gpt-5.6-terra
                label: GPT-5.6 Terra
              - value: gpt-5.6-luna
                label: GPT-5.6 Luna
              - value: gpt-5.6-sol
                label: GPT-5.6 Sol（默认）
