              - value: gpt-5.6-luna
                label: 森马 · GPT-5.6 Luna（手动对照）
          - id: shoe_execution_fallback_2
            label: 手动扩展模型 1
            default: ""
            options: *shoe_execution_fallback_options
          - id: shoe_execution_fallback_3
            label: 手动扩展模型 2
            default: ""
            options: *shoe_execution_fallback_options
        hint: 标签、补选与通用加工审核默认官方 DeepSeek → 森马 Astra。官方通用看板审核使用低推理强度，已选原图独立核验使用高推理强度，标签与补选使用官方默认强度；Astra保持低强度。姿势看板使用下方单独指定的审核模型。接口故障、标签未识别成功、审核输出无效或可见事实冲突时，使用 Astra 备用或独立复核。Astra 仍无法确定则保留待复核；有效的不匹配结论直接重选图片。Terra、森马 DeepSeek 等仅在手动扩展后使用。502/503/504最多间隔1秒、3秒追加重试2次；连续90秒无有效输出则切换。单次无活动超时或JSON内容错误不冻结整批；连续两次无活动超时才冷却120秒。同一图片及证据未变化的审核未知结果只追加一轮复核
      - id: shoe_board_review_model
        type: select
        label: 姿势看板审核模型
        default: gpt-6-astra
        ui_span: full
        visible_when:
