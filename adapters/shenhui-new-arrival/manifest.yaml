manifest_version: 2
id: shenhui-new-arrival
name: 深绘上新助手
version: 0.3.0
author: codex
description: "从森马云盘按款合并模特图与静物图，按深绘上新 SOP 规整后导出待上传图包"

compatibility:
  crawshrimp: ">=2.5.2 <3.0.0"
  electron: ">=43 <44"
  os: [darwin, win32]
  architectures: [arm64, x64]

permissions:
  - id: browser.read
    reason: 读取当前已登录的森马云盘或深绘页面
    approval: install
    scopes: ["https://fmp.semirapp.com/*", "https://www.deepdraw.biz/*"]
  - id: browser.download
    reason: 从企业网盘下载图片、PDF 和标签素材
    approval: run
  - id: browser.upload
    reason: 把用户确认的图包上传到深绘
    approval: each_use
  - id: filesystem.read
    reason: 读取用户选择的 Excel、PDF、图片和目录
    approval: run
  - id: filesystem.write
    reason: 写入整理后的图包、截图、ZIP 和验收表
    approval: run
  - id: ai.invoke
    reason: 调用已配置的多模态模型进行标签、姿势和语义识别
    approval: run
  - id: external.write
    reason: 在深绘创建或更新用户明确提交的图包
    approval: each_use

capabilities:
  - id: browser.cdp
    kind: browser
    provider: crawshrimp
    operations: [observe, evaluate, click, download, upload, readback]
  - id: filesystem.local
    kind: filesystem
    provider: crawshrimp
    operations: [read, write, list, zip]
  - id: cloud_drive.semir
    kind: cloud_drive
    provider: semir-cloud-drive
    operations: [search, list, download]
  - id: pdf.processing
    kind: pdf
    provider: crawshrimp
    operations: [render, crop, screenshot]
  - id: ocr.host
    kind: ocr
    provider: tesseract
    operations: [recognize, locate_text, verify]
  - id: ai.multimodal
    kind: ai
    provider: crawshrimp-llm-gateway
    operations: [classify, extract, consensus, validate]
    models: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
  - id: approval.review
    kind: approval
    provider: crawshrimp
    operations: [precheck, confirm_upload, audit]
  - id: data.excel
    kind: data
    provider: crawshrimp
    operations: [read, validate, export]
  - id: external.deepdraw
    kind: external_system
    provider: deepdraw
    operations: [upload, readback]

backend_handlers:
  - id: package.finalize
    runtime: platform
    entrypoint: core.api_server:_finalize_shenhui_new_arrival_outputs
    description: 整理下载文件、处理 PDF/标签并生成最终产物引用
  - id: apparel_label.process
    runtime: platform
    entrypoint: core.shenhui_apparel_label_processing:process_prepare_upload_package_labels
    description: 多模型识别服饰吊牌/洗唛并以本地 OCR 复核裁图
  - id: shoe_package.prepare
    runtime: platform
    entrypoint: core.shenhui_shoe_packaging:prepare_shoe_packages
    description: 按鞋品规则、多模型共识和标签 OCR 生成深绘图包
  - id: pdf_screenshot.finalize
    runtime: platform
    entrypoint: core.shenhui_pdf_screenshot:finalize_pdf_batch_screenshot_outputs
    description: 渲染 PDF、应用裁切模板并导出截图与结果表

contracts:
  inputs:
    - id: business_scope
      type: string
      source: task_param
      description: 款号、款色或用户明确选择的处理范围
    - id: source_assets
      type: file
      source: task_param_or_cloud_drive
      description: 本地或森马云盘中的图片、PDF、Excel 与目录
    - id: execution_confirmation
      type: boolean
      required: false
      source: task_param
      description: 上传或外部写入前的用户确认
  outputs:
    - id: delivery_package
      type: archive
      description: 按深绘目录和命名规则整理的图包或 ZIP
    - id: acceptance_report
      type: table
      description: 包含来源、处理动作、模型/OCR 证据、状态和备注的结果表
      schema:
        required_columns: [输入款号, 下载结果, 本地文件, 备注]
    - id: external_readback
      type: status
      required: false
      description: 深绘上传后的目标系统读回状态

checkpoints:
  - id: assets.downloaded
    description: 云盘素材已下载且保存来源路径和本地文件
    persisted_fields: [云盘路径, 本地文件, 下载结果]
    resume_from: material_processing
    invalidated_by: [source_path_changed, local_file_missing]
  - id: package.prepared
    description: 单款图包已完成规则处理并生成验收记录
    persisted_fields: [输入款号, 规则槽位, 处理动作, 本地文件, 备注]
    resume_from: package_validation
    invalidated_by: [rule_version_changed, source_hash_changed]
  - id: upload.readback
    description: 深绘已返回可核验的上传结果
    persisted_fields: [输入款号, 上传状态, 目标记录, 读回证据]
    resume_from: delivery_verification
    invalidated_by: [target_record_missing]

external_systems:
  - id: semir.cloud_drive
    name: 森马云盘
    kind: cloud_drive
    base_urls: [https://fmp.semirapp.com]
    auth: browser_session
    supported_versions: [web-current@2026-09]
  - id: deepdraw.web
    name: 深绘
    kind: website
    required: false
    base_urls: [https://www.deepdraw.biz]
    auth: browser_session
    supported_versions: [web-current@2026-09]

sensitive_config:
  - id: ai.llm_provider_credentials
    label: 多模态模型 Provider 凭证
    source: settings
    required: false
    secret: true
    description: 只引用抓虾 AI 能力配置，不在 Manifest 保存密钥值

acceptance:
  entrypoint: tests/manifest_acceptance.py
  command: [python, tests/manifest_acceptance.py]
  required_checks: [manifest_v2_contract, declared_entrypoints_exist, sensitive_config_has_no_inline_value]
  fixtures: []

entry_url: https://fmp.semirapp.com/web/index#/home/file

auth:
  check_script: auth_check.js
  login_url: https://fmp.semirapp.com/web/index#/home/file

tasks:
  - id: batch_label_tile_download
    name: 批量下载吊牌/洗唛/平铺图
    description: 按款号从森马云盘默认平拍/模拍路径定位素材，服饰优先下载 yq1/yq2 吊牌洗唛和平铺图；鞋品路径仅保留款色图，并对无语义图名的鞋盒标签候选做 OCR 识别后保留鞋盒标签图/电子吊牌图，按款号整理到本地目录
    script: batch-label-tile-download.js
    requires:
      permissions: [browser.read, browser.download, filesystem.write, ai.invoke]
      capabilities: [browser.cdp, filesystem.local, cloud_drive.semir, pdf.processing, ocr.host, ai.multimodal, data.excel]
      backend_handlers: [package.finalize]
      external_systems: [semir.cloud_drive]
      sensitive_config: [ai.llm_provider_credentials]
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前页面
          - value: new
            label: 全新页面（推荐）
      - id: still_cloud_path
        type: text
        label: 平拍/吊牌洗唛云盘路径
        required: true
        placeholder: "巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/平拍原图/2P/婴幼童/幼童-2.5已写/"
        hint: 默认沿用“整理深绘上新图包”的平拍原图路径；服饰洗唛、吊牌优先在这里查找；鞋品路径会下载款色图和少量无语义鞋盒标签候选，最终由后端 OCR 识别后只保留鞋盒标签图/电子吊牌图
        quick_fill_options:
          - 巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/平拍原图/2P/婴幼童/幼童-2.5已写/
      - id: model_cloud_path
        type: text
        label: 模特图云盘路径
        required: false
        placeholder: "巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/模拍原图/期货/1P/幼童服装/"
        hint: 平铺图优先从这里查找；若款号命中模拍路径，平铺图文件名会追加“有模拍”
        quick_fill_options:
          - 巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/模拍原图/期货/1P/幼童服装/
      - id: item_codes
        type: textarea
        label: 款号或款色编码
        rows: 8
        required: true
        placeholder: "一行一个，例如：\n208426108223\n208426108013"
        hint: 支持款号和款色编码；会自动去重
      - id: folder_scan_depth
        type: number
        label: 款号文件夹扫描层级
        default: 3
        min: 0
        max: 8
        step: 1
        ui_span: third
        hint: 搜索只用于定位款号文件夹；命中文件夹后会按该层级递归查找吊牌、洗唛和平铺图
      - id: download_concurrency
        type: number
        label: 下载并发数
        default: 8
        min: 1
        max: 32
        step: 1
        ui_span: third
        hint: 默认 8；图片较大或云盘限流时可降到 4-6
      - id: package_name
        type: text
        label: 导出文件夹名
        ui_span: third
        placeholder: "例如：深绘吊牌洗唛平铺图_幼童2P"
        hint: 可选。留空则按任务时间自动命名
      - id: export_folder
        type: directory
        label: 导出目录
        placeholder: "点击选择导出目录"
        hint: 可选。点击选择本地目录；留空则使用任务默认输出目录
        ui_span: third
    trigger:
      type: manual
    output:
      - type: excel
        filename: "深绘吊牌洗唛平铺图下载结果_{timestamp}.xlsx"
        columns:
          - 输入款号
          - 输入编码
          - 素材类型
          - 素材来源
          - 文件名
          - 云盘路径
          - 匹配策略
          - 模拍路径命中
          - 下载结果
          - 本地文件
          - 备注

  - id: prepare_upload_package
    name: 【服饰】整理深绘上新图包
    description: 按款号从森马云盘两条路径定位匹配文件夹，下载文件夹内模特图和静物图，过滤 SOP 中不可用素材并打包为深绘待上传图包
    script: prepare-upload-package.js
    requires:
      permissions: [browser.read, browser.download, filesystem.write, ai.invoke]
      capabilities: [browser.cdp, filesystem.local, cloud_drive.semir, pdf.processing, ocr.host, ai.multimodal, data.excel]
      backend_handlers: [package.finalize, apparel_label.process]
      external_systems: [semir.cloud_drive]
      sensitive_config: [ai.llm_provider_credentials]
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前页面
          - value: new
            label: 全新页面（推荐）
      - id: image_source_type
        type: radio
        label: 下载图片类型
        default: all
        options:
          - value: all
            label: 静物图 + 模特图
          - value: still
            label: 只下静物图
          - value: model
            label: 只下模特图
        hint: 默认两类都下载；单选后只校验和下载对应图包
      - id: still_cloud_path
        type: text
        label: 静物图云盘路径
        required: true
        placeholder: "巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/平拍原图/2P/婴幼童/幼童-2.5已写/"
        hint: SOP 中的平拍/静物图包路径
        visible_when:
          field: image_source_type
          in: [all, still]
        quick_fill_options:
          - 巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/平拍原图/2P/婴幼童/幼童-2.5已写/
      - id: model_cloud_path
        type: text
        label: 模特图云盘路径
        required: true
        placeholder: "巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/模拍原图/期货/1P/幼童服装/"
        hint: SOP 中的模拍/模特图包路径
        visible_when:
          field: image_source_type
          in: [all, model]
        quick_fill_options:
          - 巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉夏/模拍原图/期货/1P/幼童服装/
      - id: item_codes
        type: textarea
        label: 款号或款色编码
        rows: 6
        required: false
        placeholder: "一行一个，例如：\n208226102001\n208226103201-00316"
        hint: 支持款号和款色编码；如选择下方失败结果表，可留空并只重跑失败素材
      - id: retry_failed_file
        type: file_excel
        label: 失败结果表（可选）
        required: false
        hint: 选择上一轮“整理结果”Excel 后，只重跑其中下载失败/获取链接失败且有云盘路径的素材
      - id: duplicate_mode
        type: select
        label: 重复素材处理
        default: first_per_path
        ui_span: third
        options:
          - value: first_per_path
            label: 同一路径只保留一份（推荐）
          - value: all
            label: 保留全部匹配素材
        hint: 默认按云盘路径去重；如需完整保留重复素材可切换
      - id: folder_scan_depth
        type: number
        label: 款号文件夹扫描层级
        default: 3
        min: 0
        max: 8
        step: 1
        ui_span: third
        hint: 搜索只用于定位款号文件夹；命中文件夹后会按该层级递归下载文件夹内素材
      - id: download_concurrency
        type: number
        label: 下载并发数
        default: 8
        min: 1
        max: 32
        step: 1
        ui_span: third
        hint: 默认 8；图片较大或云盘限流时可降到 4-6，网络稳定可提高到 10
      - id: auto_zip_package
        type: checkbox
        label: 是否自动压缩
        default: []
        ui_span: third
        options:
          - value: "yes"
            label: 自动压缩为款号 ZIP
        hint: 默认不压缩，只按款号整理到导出目录；需要直接上传深绘时再选择“是”
      - id: wash_crop_boxes
        type: textarea
        label: 洗唛截图框模板
        rows: 3
        ui_span: half
        default: '[{"x":0.0892,"y":0.2084,"width":0.4189,"height":0.7546}]'
        placeholder: '[{"x":0.02,"y":0.02,"width":0.48,"height":0.96},{"x":0.50,"y":0.02,"width":0.48,"height":0.96}]'
        hint: 自动处理网盘洗唛 PDF 时使用；默认会读取 PDF 批量截图中保存的同类型模板
      - id: tag_crop_boxes
        type: textarea
        label: 吊牌截图框模板
        rows: 3
        ui_span: half
        default: '[{"x":0.0113,"y":0.2352,"width":0.1535,"height":0.5058}]'
        placeholder: '[{"x":0.01,"y":0.25,"width":0.16,"height":0.55}]'
        hint: 自动处理网盘吊牌 PDF 时使用；默认会读取 PDF 批量截图中保存的同类型模板
      - id: package_name
        type: text
        label: 导出包名称
        ui_span: third
        placeholder: "例如：深绘上新图包_幼童2P"
        hint: 可选。留空则按任务时间自动命名
      - id: export_folder
        type: directory
        label: 导出目录
        placeholder: "点击选择导出目录"
        hint: 可选。点击选择本地目录；留空则使用任务默认输出目录
        ui_span: third
    trigger:
      type: manual
    output:
      - type: excel
        filename: "深绘上新图包整理结果_{timestamp}.xlsx"
        columns:
          - 输入款号
          - 输入编码
          - 素材来源
          - 文件名
          - 云盘路径
          - 处理动作
          - 下载结果
          - 本地文件
          - 压缩结果
          - 标签角色
          - 识别模型
          - 识别款号
          - 识别色号
          - 识别尺码
          - 标签判定
          - 标签证据
          - 最终裁图
          - 备注

  - id: prepare_shoe_upload_package
    name: 【鞋品】整理深绘上新图包
    description: 先核对鞋盒标签确定品类与颜色，再按模板整理各渠道图包并保留全部原图。jdt、tmt 和标签图输出 800×800，不足透明补边；wpt 保留原尺寸与透明底，压缩后仍超限的图片保留并在结果表注明
    script: prepare-shoe-upload-package.js
    requires:
      permissions: [browser.read, browser.download, filesystem.read, filesystem.write, ai.invoke]
      capabilities: [browser.cdp, filesystem.local, cloud_drive.semir, pdf.processing, ocr.host, ai.multimodal, data.excel]
      backend_handlers: [package.finalize, shoe_package.prepare]
      external_systems: [semir.cloud_drive]
      sensitive_config: [ai.llm_provider_credentials]
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前页面
          - value: new
            label: 全新页面（推荐）
      - id: shoe_cloud_path
        type: text
        label: 鞋品云盘路径
        required: true
        placeholder: "巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉秋/平拍原图/全域/小程序/鞋品/"
        hint: 填写鞋品平拍原图上级目录；脚本会搜索款号文件夹并递归下载各颜色素材
        quick_fill_options:
          - 巴拉营运BU-商品//巴拉货控/02 产品上新模块/2-2 巴拉产品上新/2026年巴拉秋/平拍原图/全域/小程序/鞋品/
      - id: shoe_category_file
        type: file_excel
        label: 款号品类表
        required: true
        hint: 必填；上传含“款号、品类”两列的 Excel/CSV。款号必填，品类可留空；填写时优先使用表内品类；巴拉专属模型须明确填写品类，其他模式留空时根据核验后的标签名称识别
        template_file: assets/鞋品品类映射模板.xlsx
        template_label: 下载鞋品品类模板
      - id: shoe_pose_strategy
        type: select
        label: 鞋品找图流程
        default: bala_specialist
        ui_span: full
        options:
          - value: bala_specialist
            label: "【推荐】巴拉鞋品专属模型识别"
          - value: mask_board_review
            label: 蒙版直接初选 + 按款看板审核（新流程）
          - value: sequential_templates
            label: 蒙版 + 模型精选 + 按款看板审核（对照）
          - value: single_sheet
            label: 全部候选拼一张大图（旧版对照）
          - value: global_pages
            label: 全局分页识别 + 规则锁槽
          - value: batch_overview
            label: 少图多批次 + 全景上下文
          - value: batch
            label: 少图多批次
        hint: 巴拉专属模式使用本地DINOv2和OCR，按现有规则完整导出，不调用大模型；模型与OCR随应用内置，须填写品类。其他审核流程：标签识别与框选 → 蒙版直接初选 → 按款号生成模板/原图/成品对照看板 → 模型逐行审核 → 只对问题图位AI补选或修改 → 复审。初次姿势选图不调用模型；蒙版高分不能直接通过。审核未知保留原图，功能卡缺失须检查完整素材。已通过且未变化的图位复用审核。对照流程保留首次模型精选。标签与补选默认官方 DeepSeek，姿势看板默认 Astra
      - id: shoe_style_workers
        type: number
        label: 同时处理款数
        default: 8
        min: 1
        max: 8
        step: 1
        hint: 默认 8；提高并发会增加内存占用。建议根据整批耗时和机器内存测试后调整
        visible_when:
          field: shoe_pose_strategy
          in: [mask_board_review, sequential_templates]
      - id: shoe_request_workers
        type: number
        label: 同时请求模型数
        default: 8
        min: 1
        max: 32
        step: 1
        hint: 所有款的选图、标签及审核共用此上限；提高款数不会无限叠加模型请求。默认8，按实测吞吐调整
        visible_when:
          field: shoe_pose_strategy
          in: [mask_board_review, sequential_templates]
      - id: shoe_execution_model_chain
        type: model_chain
        label: 标签、补选、原图核验与通用加工审核模型顺序
        ui_span: full
        visible_when:
