          - value: deepseek-official-flash
            label: DeepSeek 官方 Flash（低推理强度，对照）
          - value: ""
            label: 跟随上方模型顺序（对照）
        hint: 姿势和功能卡图位按款集中看板审核；指定模型无法确定时保留待复核，不自动由其他模型放行。看板通过或结论矛盾的姿势图再单独核验原图事实，不带模板、图位与前序结论；同源图只查一次，核验沿用上方模型顺序。明确事实不符才补选，看不清保留待复核。标准图、标签派生和辅助加工看板沿用上方模型顺序。初选仍由本地蒙版完成，只有问题图位才调用AI补选。
