              label: 森马 · GPT-5.6 Terra
            - value: deepseek-v4.1-flash
              label: 森马 · DeepSeek V4.1 Flash
            - value: gpt-5.6-sol
              label: 森马 · GPT-5.6 Sol（手动对照）
            - value: gpt-5.6-luna
              label: 森马 · GPT-5.6 Luna（手动对照）
        fallback_models:
          - id: shoe_execution_fallback_1
            label: 后续模型 1
            default: gpt-6-astra
            options: &shoe_execution_fallback_options
              - value: ""
                label: 不使用
              - value: gpt-6-astra
                label: 森马 · GPT-6 Astra（低推理强度）
              - value: deepseek-official-flash
