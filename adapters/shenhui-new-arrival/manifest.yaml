  - id: upload_to_deepdraw
    name: 上传深绘图片包
    description: 在深绘“产品素材 / 图片包上传”页按款号搜索产品，选择匹配行并批量上传款号命名的 ZIP 图片包；执行模式为真实上传时会直接提交
    script: upload-to-deepdraw.js
    requires:
      permissions: [browser.read, browser.upload, filesystem.read, external.write]
      capabilities: [browser.cdp, filesystem.local, approval.review, external.deepdraw, data.excel]
      external_systems: [deepdraw.web]
    entry_url: https://www.deepdraw.biz/authorized/merchant/index
    tab_match_prefixes:
      - https://www.deepdraw.biz/authorized/merchant/index
    skip_auth: true
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: current
        options:
          - value: current
            label: 当前页面（推荐）
          - value: new
            label: 全新页面
      - id: package_zip_paths
        type: file_zip
        label: 款号 ZIP 压缩包
        required: true
        hint: 支持批量选择 ZIP；ZIP 文件名必须等于深绘产品货号；整理任务会额外产出这些款号 ZIP
      - id: upload_mode
        type: radio
        label: 执行模式
        default: dry_run
        options:
          - value: dry_run
            label: 只校验并入队（不上传）
          - value: upload
            label: 真实上传到生产
        hint: 默认不会点击上传；切换为真实上传后会直接调用深绘上传
      - id: upload_poll_timeout_minutes
        type: number
        label: 上传处理等待分钟
        default: 20
        min: 1
        max: 120
        step: 1
        ui_span: third
        hint: 真实上传后等待深绘处理结果的最长时间
    trigger:
      type: manual
    output:
      - type: excel
        filename: "深绘图片包上传结果_{timestamp}.xlsx"
        columns:
          - 款号
          - ZIP文件
          - 搜索结果
          - 产品ID
          - 期数
          - 处理阶段
          - 上传结果
          - 备注

  - id: pdf_batch_screenshot
    name: PDF 批量截图
    description: 批量选择本地 PDF 吊牌/水洗文件，截图并裁切为深绘可用的 yq 图片包
    script: pdf-batch-screenshot.js
    requires:
      permissions: [filesystem.read, filesystem.write]
      capabilities: [filesystem.local, pdf.processing, data.excel]
      backend_handlers: [package.finalize, pdf_screenshot.finalize]
    entry_url: about:blank
    skip_auth: true
    params:
      - id: wash_pdf_files
        type: file_pdf
        label: 洗唛 PDF 文件
        required: false
        hint: 选择洗唛 PDF；会按洗唛模板裁切，输出 yq(2) 图片
      - id: tag_pdf_files
        type: file_pdf
        label: 吊牌 PDF 文件
        required: false
        hint: 选择吊牌/合格证 PDF；会按吊牌模板裁切，输出 yq(1) 图片
      - id: wash_crop_boxes
        type: textarea
        label: 洗唛截图框模板
        rows: 3
        ui_span: half
        default: '[{"x":0.0892,"y":0.2084,"width":0.4189,"height":0.7546}]'
        placeholder: '[{"x":0.02,"y":0.02,"width":0.48,"height":0.96},{"x":0.50,"y":0.02,"width":0.48,"height":0.96}]'
        hint: 可选；支持比例或像素 x/y/width/height，多个框会依次输出 yq-1、yq-2
      - id: tag_crop_boxes
        type: textarea
        label: 吊牌截图框模板
        rows: 3
        ui_span: half
        default: '[{"x":0.0113,"y":0.2352,"width":0.1535,"height":0.5058}]'
        placeholder: '[{"x":0.01,"y":0.25,"width":0.16,"height":0.55}]'
        hint: 可选；按吊牌同版式批量裁切，留空则使用自动裁白和分栏
      - id: output_mode
        type: select
        label: 输出模式
        default: create_package
        ui_span: half
        options:
          - value: create_package
            label: 生成独立截图包
          - value: merge_existing_zips
            label: 合并到导出目录同款号 ZIP
        hint: 合并模式会在导出目录下查找“12位款号.zip”，把本次截图的 yq 图追加/替换到对应 ZIP 根目录
      - id: package_name
        type: text
        label: 导出包名称
        ui_span: half
        placeholder: "例如：深绘PDF截图_幼童2P"
        hint: 可选。留空则按任务时间自动命名
      - id: export_folder
        type: directory
        label: 导出目录
        placeholder: "点击选择导出目录"
        hint: 可选。点击选择本地目录；留空则使用任务默认输出目录
        ui_span: half
    trigger:
      type: manual
    output:
      - type: excel
        filename: "深绘PDF截图结果_{timestamp}.xlsx"
        columns:
          - PDF文件
          - PDF类型
          - 原始路径
          - 处理动作
          - 备注
