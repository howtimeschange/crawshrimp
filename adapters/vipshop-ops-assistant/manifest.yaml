  - id: mop_online_status_statistics
    name: MOP-唯品商品在线情况统计
    description: 按 SOP 从唯品商品列表读取商品信息，统计本次上线/下线数量，并结合上次商品信息表或手填数量计算环比，通过钉钉同步运营。
    script: MOP-vipshop-online-status-statistics.js
    entry_url: https://nov-admin.vip.com/admin/index.html#/normal/normalMerchandise
    tab_match_prefixes:
      - https://vis.vip.com/
      - https://nov-admin.vip.com/
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前唯品商品列表页
          - value: new
            label: 新开商品列表页（推荐）
        hint: 请先在 9222 端口 Chrome 登录唯品会；脚本使用商品资料页面 API 分页读取商品状态。
      - id: previous_file
        type: file_excel
        label: 上次商品信息表
        required: false
        hint: 可选。上传上一次下载的商品信息表后，脚本按「商品状态」列自动统计上次上线/下线数量并计算环比。
      - id: previous_online_count
        type: number
        label: 上次上线数量
        required: false
        min: 0
        step: 1
        ui_span: third
        hint: 未上传上次商品信息表时可手填；用于计算「本次上线数量 / 上次上线数量 - 1」。
      - id: previous_offline_count
        type: number
        label: 上次下线数量
        required: false
        min: 0
        step: 1
        ui_span: third
        hint: 未上传上次商品信息表时可手填；用于计算「本次下线数量 / 上次下线数量 - 1」。
      - id: style_codes
        type: textarea
        label: 限定款号
        required: false
        rows: 3
        placeholder: "可选；留空统计全部商品"
        hint: 多个款号可换行、逗号或空格分隔；留空时按当前账号权限统计全部商品列表。
      - id: goods_codes
        type: textarea
        label: 限定货号
        required: false
        rows: 3
        placeholder: "可选；留空统计全部商品"
        hint: 多个货号可换行、逗号或空格分隔；填写后按完整货号查询。
      - id: page_size
        type: number
        label: 每页数量
        default: 500
        min: 20
        max: 500
        step: 20
        ui_span: third
      - id: max_pages
        type: number
        label: 最多页数
        default: 200
        min: 1
        max: 1000
        step: 1
        ui_span: third
    trigger:
      type: manual
    output:
      - type: excel
        filename: "MOP-唯品商品在线情况统计_{timestamp}.xlsx"
        sheet_key: __sheet_name
        columns:
          - 统计口径
          - 本次商品总数
          - 本次商品上线数量
          - 本次商品下线数量
          - 本次其他状态数量
          - 上次商品上线数量
          - 上次商品下线数量
          - 上线数量环比
          - 下线数量环比
          - 上次数据来源
          - 商品ID
          - 款号
