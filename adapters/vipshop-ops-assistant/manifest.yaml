id: vipshop-ops-assistant
name: 唯品会运营助手
version: 0.2.3
author: codex
description: "唯品会罗盘与供应商平台运营报表工具"
entry_url: https://compass.vip.com/frontend/index.html#/product/details
tab_match_prefixes:
  - https://compass.vip.com/frontend/index.html
  - https://compass.vip.com/

auth:
  check_script: auth_check.js
  login_url: https://vis.vip.com/

tasks:
  - id: package_main_image_replace
    name: 【巴拉】包装+主图替换
    description: 读取款号/货号清单，默认从森马云盘按款号查找并下载图包，再在唯品会商品资料/PDC 中匹配目标颜色，完成包装微详情、商品详情切片、主图和列表图替换；默认只做预检且不执行真实上传，选择找图并且真实上传时执行真实保存提交。
    script: vipshop-package-main-image-replace.js
    entry_url: https://nov-admin.vip.com/admin/index.html#/normal/normalMerchandise
    tab_match_prefixes:
      - https://vis.vip.com/
      - https://nov-admin.vip.com/
      - https://pdc-portal.vip.com/
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前唯品后台页面
          - value: new
            label: 新开商品资料页（推荐）
        hint: 请先在 9222 端口 Chrome 登录唯品会；默认新开 nov-admin 商品资料页，避免外层 vis 页面跨域拦截接口。
      - id: execute_mode
        type: radio
        label: 执行模式
        default: plan
        options:
          - value: plan
            label: 预检（不执行真实上传）
          - value: live
            label: 找图并且真实上传
        hint: 默认只做预检，不执行真实上传；选择找图并且真实上传时脚本会取消审核/撤回、上传图片、保存并提交审核。
      - id: upload_scope
        type: checkbox
        label: 上传功能
        default:
          - full
        options:
          - value: full
            label: 完整上传
          - value: main_image
            label: 只传打标图
          - value: package
            label: 只传包装图（商详页+商品展示345）
        hint: 默认完整上传，即同时找图并上传打标图和包装图；打标图包含商品展示图第1张与商品列表图首图，包装图包含商详页图与商品展示图第3/4/5张。旧参数 operation_scope、detail_image 仍兼容。
      - id: phase_eval_timeout_ms
        type: number
        label: OCR相位超时
        default: 180000
        min: 8000
        max: 600000
        step: 1000
        ui_span: third
        hidden: true
        hint: 默认隐藏。OCR 运行在当前 9222 浏览器页面内；图片较多时需放宽单相位 CDP 执行超时。
      - id: cloud_path
        type: text
        label: 包装图云盘主路径
        required: false
        default: "巴拉巴拉品牌事业部-市场系统//品牌视觉部/服饰包装组/巴拉服饰产品包装/01-产品包装/"
        placeholder: "巴拉巴拉品牌事业部-市场系统//品牌视觉部/服饰包装组/巴拉服饰产品包装/01-产品包装/"
        hint: 默认在品牌视觉部服饰产品包装根目录内按款号搜索；包装微详情从款号文件夹下“微详情”取 1200x1200 图并写入商品展示图第3/4/5张，商品详情切片仍从 images/切片/详情目录识别。
      - id: main_image_cloud_root
        type: text
        label: 打标图云盘根路径
        required: false
        default: "巴拉巴拉品牌事业部-市场系统//品牌视觉部/"
        placeholder: "巴拉巴拉品牌事业部-市场系统//品牌视觉部/"
        hint: 主图/列表图 1200 和 950 从该根路径下搜索，要求结果路径包含“主图打标（京东唯品）”和“回图/唯品”；脚本会下载同款所有色号打标图，再按页面 colourGSN 匹配上传。
      - id: main_image_path_features
        type: textarea
        label: 打标图路径特征
        required: false
        default: "主图打标\n京东唯品\n回图/唯品"
        hint: 默认按这些路径特征过滤森马云盘搜索结果；如后续目录命名变化，可逐行补充/调整。
      - id: folder_scan_depth
        type: number
        label: 云盘目录扫描深度
        default: 5
        min: 1
        max: 10
        step: 1
        ui_span: third
        hint: 控制从款号目录向下递归查找图片的层级。
      - id: cloud_download_dir
        type: directory
        label: 云盘图片导出目录
        required: false
        placeholder: "点击选择云盘素材导出目录"
        hint: 可选。选择后，脚本会把从森马云盘下载的包装图和打标图按款号/货号/用途导出到该目录；留空则使用抓虾运行时 artifact 目录。
      - id: input_file
        type: file_excel
        label: 款号货号表
        required: true
        templates:
          - file: templates/vipshop-package-main-image-replace-template.xlsx
            label: Excel 模板
            description: 填写“款号”“货号”两列；货号必须是完整款色号，避免相似颜色误匹配。
            version: "2026.08.04.2"
        hint: 必须包含“款号”“货号”两列；脚本按完整货号匹配 PDC 颜色，拼款时只规划目标货号对应颜色。默认模板为 xlsx，避免 Windows Excel 误识别 CSV 编码或长货号。
    trigger:
      type: manual
    output:
      - type: excel
        filename: "唯品会包装主图替换预检_{timestamp}.xlsx"
        sheet_key: __sheet_name
        columns:
          - 表格行号
          - 款号
          - 货号
          - 商品ID
          - V_SPU
          - P_SPU
          - 商品状态
          - 商品名称
          - 后台款号
          - 是否拼款
          - 目标颜色
          - 目标色号
          - 颜色匹配
          - 操作范围
          - 图片用途
          - 图片索引
          - 本地文件
          - 识别尺寸
          - 接口路径
          - 执行结果
          - 备注
        sheets:
          - name: 包装主图替换计划
            columns:
              - 表格行号
              - 款号
              - 货号
              - 商品ID
              - V_SPU
              - P_SPU
              - 商品状态
              - 商品名称
              - 后台款号
              - 是否拼款
              - 目标颜色
              - 目标色号
              - 颜色匹配
              - 操作范围
              - 图片用途
              - 图片索引
              - 本地文件
              - 识别尺寸
              - 接口路径
              - 执行结果
              - 备注
          - name: 执行摘要
            columns:
              - 汇总类型
              - 源表行号
              - 款号
              - 货号
              - 商品ID
              - 商品状态
              - 目标颜色
              - 最终结果
              - 已下载素材数
              - 计划替换图片数
              - 已上传图片数
              - 失败原因/读回结果
              - 处理建议

  - id: hot_strategy_tracking_report
    name: 【巴拉】爆款策略追踪报表
    description: 根据需求文档抓取魔方罗盘销售明细、唯直达投放效果、T-max 商品打爆效果、中台礼金、购物车/跨品类券列表；已验证接口均走页面 API 分页，只读不提交。
    script: hot-strategy-tracking-report.js
    entry_url: https://compass.vip.com/frontend/index.html#/product/details
    tab_match_prefixes:
      - https://vis.vip.com/
      - https://compass.vip.com/frontend/index.html
      - https://compass.vip.com/
      - https://bct.vip.com/
      - https://e.vip.com/
      - https://passport.vip.com/
    skip_auth: false
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: current
            label: 当前唯品后台页面
          - value: new
            label: 新开罗盘商品明细页（推荐）
        hint: 默认先打开「魔方罗盘 - 商品明细」，脚本会在同一标签页切到 BCT 策略效果页继续只读抓取。
      - id: report_scope
        type: checkbox
        label: 抓取范围
        default:
          - compass_sales_detail
          - vipdirect_ads
          - tmax_goods
          - bct_gift
          - bct_scene
        ui_variant: dropdown_multi
        options:
          - value: compass_sales_detail
            label: 魔方罗盘销售明细
          - value: vipdirect_ads
            label: 唯直达投放效果
          - value: tmax_goods
            label: T-max商品打爆效果
          - value: bct_gift
            label: 中台营销礼金
          - value: bct_scene
            label: 中台购物车/跨品类券
        hint: 唯直达投放效果和 T-max 商品打爆均走已验证的营销平台只读接口；脚本分页抓取，不触发官方导出任务。
      - id: brand_keyword
        type: text
        label: 品牌关键词
        default: 巴拉巴拉
        ui_span: third
        hint: BCT 可用品牌里按名称/编码匹配；默认匹配巴拉巴拉。
      - id: start_date
        type: date
        label: 数据开始日期
        placeholder: "例如：2026-07-01；留空则读取罗盘页面统计日期"
        ui_span: third
        hint: 用于魔方罗盘商品明细；支持 YYYY-MM-DD 或 YYYYMMDD。
      - id: end_date
        type: date
        label: 数据结束日期
        placeholder: "留空则同开始日期"
        ui_span: third
        hint: 用于魔方罗盘商品明细；留空时与开始日期一致。
      - id: vipdirect_start_date
        type: date
        label: 唯直达开始日期
        placeholder: "例如：2026-07-19；留空则取近15天"
        ui_span: third
        hint: 用于唯直达投放效果；留空时按营销平台默认近15天窗口。
      - id: vipdirect_end_date
        type: date
        label: 唯直达结束日期
        placeholder: "例如：2026-08-02；留空则取昨天"
        ui_span: third
        hint: 用于唯直达投放效果；留空时按营销平台默认近15天窗口。
      - id: tmax_start_date
        type: date
        label: T-max开始日期
        placeholder: "例如：2026-07-19；留空则取近15天"
        ui_span: third
        hint: 用于 T-max 商品打爆效果；留空时按营销平台默认近15天窗口。
      - id: tmax_end_date
        type: date
        label: T-max结束日期
        placeholder: "例如：2026-08-02；留空则取昨天"
        ui_span: third
        hint: 用于 T-max 商品打爆效果；留空时按营销平台默认近15天窗口。
      - id: bct_activity_start
        type: date
        label: BCT活动开始
        placeholder: "例如：2026-07-01；留空则不限制"
        ui_span: third
        hint: 映射中台策略效果筛选项「活动时间」开始，自动补 00:00:00。
      - id: bct_activity_end
        type: date
        label: BCT活动结束
        placeholder: "例如：2026-07-31；留空则不限制"
        ui_span: third
        hint: 映射中台策略效果筛选项「活动时间」结束，自动补 23:59:59。
      - id: page_size
        type: number
        label: 每页数量
        default: 300
        min: 20
        max: 500
        step: 20
        ui_span: third
        hint: 罗盘最多 500；BCT 页面接口按当前前端分页上限自动收敛到 300。
      - id: max_pages
        type: number
        label: 最多页数
        default: 80
        min: 1
        max: 1000
        step: 1
        ui_span: third
        hint: 防止后台异常无限分页；默认可覆盖 2.4 万行以内的 BCT 列表。
    trigger:
      type: manual
    output:
      - type: excel
        filename: "唯品会爆款策略追踪报表_{timestamp}.xlsx"
        sheet_key: __sheet_name
        columns:
          - 报表来源
