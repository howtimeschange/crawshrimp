            label: 森马儿童
          - value: any
            label: 不限制品牌
        hint: 自动模式会把 SEMIR 映射为森马，balabala/Balabala Shoes 映射为巴拉巴拉，minibala 映射为 mini bala。
      - id: scm_only_completed
        type: checkbox
        label: 只接受 SCM 已完成记录
        default: true
        hint: 开启后优先读取 SCM 洗唛批复判定状态为“已完成”的 SKC 行；未能读取或无法映射洗护说明时会使用固定洗护符号继续处理。
      - id: scm_composition_mode
        type: select
        label: SCM 成分处理方式
        default: evidence_only
        options:
          - value: evidence_only
            label: 只记录 SCM 证据，不回填 TEMU
        hint: 按最新业务反馈，成分不需要回填 TEMU 系统；脚本只保留 SCM 成分、备注和附件作为诊断证据。
      - id: care_symbols_mode
        type: radio
        label: 洗护符号来源
        default: scm_or_fixed
        options:
          - value: scm_or_fixed
            label: SCM 映射，异常用固定符号
          - value: fixed_defaults
            label: 固定洗护符号
          - value: scm_confirmed_json
            label: SCM 确认 JSON
          - value: manual_json
            label: 人工 JSON
        hint: 固定符号按 2026-07-31 反馈：30℃水洗、不可漂白、阴干、110℃无蒸汽熨烫、不可干洗。SCM 正常读取到洗护说明时会映射 TEMU 五项枚举。
      - id: care_symbols_json
        type: textarea
        label: 人工洗护符号 JSON
        default: '{"washing":10,"bleaching":3,"drying":5,"ironing":3,"dryCleaning":5}'
        visible_when:
          field: care_symbols_mode
          not_equals: scm_or_fixed
        hint: 仅在选择 SCM 确认 JSON 或人工 JSON 时填写；固定洗护符号模式会忽略该字段。字段必须包含 washing、bleaching、drying、ironing、dryCleaning。
      - id: manufacturer_name
