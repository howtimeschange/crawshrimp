        max: 100
        step: 1
      - id: timeout_seconds
        type: number
        label: 下载等待秒数
        default: 60
        min: 5
        max: 120
        step: 5
        hint: 等待 TEMU 官方 PDF 浏览器下载完成；失败时只输出诊断，不生成截图恢复稿。
    trigger:
      type: manual
    output:
      - type: json
        filename: "wash-label-create-and-download-diagnostic_{timestamp}.json"

