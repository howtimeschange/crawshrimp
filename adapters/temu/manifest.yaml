        default: true
        hint: 开启后通过 TEMU 官方导出弹窗仅选择 PDF，并校验本地文件以 %PDF- 开头。
      - id: skip_already_made
        type: checkbox
        label: 已制作项不重复保存
        default: true
        hint: 已制作项只按参数决定是否下载官方 PDF，不会自动编辑或重新保存。
      - id: scm_lookup
        type: checkbox
        label: 自动查询 SCM 洗唛批复判定
        default: true
        hint: 使用 9222 浏览器中已登录的 scm.semir.com 标签页；脚本只操作页面控件和组件数据，不复制 SCM 请求头、Cookie 或 token。
