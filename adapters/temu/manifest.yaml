          - value: new
            label: 新开标签页
      - id: store_name
        type: select
        label: TEMU 店铺
        default: balabala Official Shop
        required: true
        options:
          - value: minibala Kids Shop
            label: minibala Kids Shop
          - value: SEMIR Official Shop
            label: SEMIR Official Shop
          - value: balabala Official Shop
            label: balabala Official Shop
          - value: Balabala Shoes
            label: Balabala Shoes
