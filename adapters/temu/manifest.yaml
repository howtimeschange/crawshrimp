  - id: store_items
    name: 站点商品
    description: 抓取 Temu 店铺商品列表（商品名/图片/角标/价格/评分/评价数/链接），自动加载全量
    script: store-items.js
    entry_url: https://www.temu.com
    skip_auth: true
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: new
        options:
          - value: new
            label: 全新页面（推荐）
          - value: current
            label: 在当前页面
      - id: shop_url
        type: text
        label: 店铺链接
        placeholder: "例: https://www.temu.com/mall.html?mall_id=634418214560482"
        hint: 请填写 Temu 店铺主页链接
        required: true
    trigger:
      type: manual
    output:
      - type: excel
        filename: "{shop_name}_站点商品_{timestamp}.xlsx"
        columns:
          - 商品链接
          - 商品名称
          - 商品图片
          - 商品角标
          - 价格
          - 原价
          - 价格备注
          - 销量
          - 评分
          - 评价数
          - 品牌/店铺标签
          - goods_id
