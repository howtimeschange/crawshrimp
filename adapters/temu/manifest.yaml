  - id: compliant_live_photos_label
    name: 商品实拍图洗唛合规
    description: 批量处理 Temu 合规中心「商品实拍图」页的标签图上传，优先处理“避免影响商品发货入库”的异常款，并自动提交深度识别。
    script: compliant-live-photos-label.js
    entry_url: https://agentseller.temu.com/govern/compliant-live-photos
    params:
      - id: mode
        type: radio
        label: 打开方式
        default: current
        options:
          - value: current
            label: 使用当前标签页
          - value: new
            label: 新开标签页
      - id: max_products
        type: number
        label: 最大处理款数
        min: 1
        step: 1
        hint: 留空表示持续执行，直到三个快速筛选 tab 中没有待处理商品。
      - id: compensation_mode
        type: radio
        label: 执行范围
        default: normal
        options:
          - value: normal
            label: 正常扫描（可跳过历史已提交 SPU）
          - value: retry_failed_from_file
            label: 仅补偿重试结果文件中的失败 SPU
          - value: target_spus
            label: 仅处理下方指定 SPU
        hint: 如选择结果文件，脚本会自动按 SPU 跳过其中“已提交/跳过”的历史记录；指定 SPU 模式下会逐条按 SPU 查询后上传。
      - id: retry_result_file
        type: file_excel
        label: 历史结果文件
        visible_when:
          field: compensation_mode
          equals: retry_failed_from_file
        hint: 可选。选择上一次导出的结果表（Excel / CSV）后，脚本会按 SPU 跳过已成功的款，并可按失败 SPU 做补偿重试。
      - id: target_spus
        type: textarea
        label: 指定 SPU 款号
        placeholder: "每行一个 SPU，例如：\n1234567890\n2345678901"
        rows: 6
        visible_when:
          field: compensation_mode
          equals: target_spus
        hint: 执行范围选择“仅处理下方指定 SPU”时生效；请按换行区分 SPU，脚本会逐条查询后上传。
      - id: goods_statuses
        type: checkbox
        label: 商品状态
        visible_when:
          field: compensation_mode
          not_equals: target_spus
        hint: 默认仅处理「在售中」；可多选，全部取消则不过滤商品状态。
        default:
          - 在售中
        options:
          - value: 在售中
            label: 在售中
          - value: 未发布到站点
            label: 未发布到站点
          - value: 已下架
            label: 已下架
          - value: 已终止
            label: 已终止
          - value: 已删除
            label: 已删除
      - id: clothing_subject_label_images
        type: file_images
        label: 服装主体标签图
        max: 5
        hint: 上传到「商品主体实拍图 > 标签图」，可不传；支持多选，最多 5 张 jpg/png/jpeg。
      - id: clothing_package_label_images
        type: file_images
        label: 服装外包装标签图
        max: 5
        hint: 上传到「商品外包装实拍图 > 标签图」，可不传；支持多选，最多 5 张 jpg/png/jpeg。
      - id: shoe_subject_label_images
        type: file_images
        label: 鞋品主体标签图
        max: 5
        hint: 上传到「商品主体实拍图 > 标签图」，可不传；支持多选，最多 5 张 jpg/png/jpeg。
      - id: shoe_package_label_images
        type: file_images
        label: 鞋品外包装标签图
        max: 5
