        hint: 脚本会按 SOP 固定取所填日期所在月份的 1 号，相当于日期弹窗左侧当月的 1 号。
      - id: batch_number
        type: text
        label: 批次号
        default: "PC260601"
      - id: label_width_mm
        type: number
        label: 洗水唛宽度 mm
        default: 45
        min: 10
        max: 100
        step: 1
